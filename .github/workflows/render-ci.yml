name: Render Service Build
on:
  push:
    branches: [master, main, codex/render-deployment]
    paths: ['render-service/**', 'render.yaml', '.github/workflows/render-ci.yml']
  pull_request:
    branches: [master, main]
    paths: ['render-service/**', 'render.yaml', '.github/workflows/render-ci.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: render-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: render-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
