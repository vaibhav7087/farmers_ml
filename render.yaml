services:
  - type: web
    name: kisaan-ml-render
    runtime: node
    plan: free
    region: singapore
    rootDir: render-service
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: kisaan-ml-redis
          property: connectionString
  - type: keyvalue
    name: kisaan-ml-redis
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

