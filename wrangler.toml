name = "kisaan-ml-api"
main = "workers/src/index.ts"
compatibility_date = "2024-10-08"
compatibility_flags = ["nodejs_compat"]
account_id = "e4c9934ee538c49b0b09fa1eb6f57162"

[env]
ENVIRONMENT = "production"

[vars]
MODEL_BUCKET = "kisaan-ml-models"
CACHE_TTL = "3600"

[[kv_namespaces]]
binding = "CACHE_KV"
id = "d2bfb1c17b3e42d589228e08ebaab98a"
preview_id = "d2bfb1c17b3e42d589228e08ebaab98a"

[[d1_databases]]
binding = "DB"
database_name = "kisaan-ml"
database_id = "7b6c8e10-e2a7-43bd-aed4-8d5854b00bcc"

[triggers]
crons = ["0 6 * * *"]  # Daily at 6 AM for model retraining

[observability]
enabled = true