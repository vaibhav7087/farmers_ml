services:
  - type: web
    name: kisaan-ml-render
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: REDIS_URL
        fromDatabase:
          name: kisaan-ml-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: kisaan-ml-postgres
          property: connectionString
      - key: CF_R2_ACCOUNT_ID
        sync: false
      - key: CF_R2_ACCESS_KEY_ID
        sync: false
      - key: CF_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CF_R2_BUCKET
        value: kisaan-ml-models
      - key: CF_WORKERS_API_URL
        value: https://kisaan-ml-api.your-subdomain.workers.dev
      - key: PIB_RSS_URL
        value: https://pib.gov.in/RssMain.aspx?ModId=6&Lang=1&RegId=3
      - key: PLANETARY_COMPUTER_API
        value: https://api.planetarycomputer.microsoft.com/api/stac/v1
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /health
    autoDeploy: true

databases:
  - name: kisaan-ml-postgres
    plan: starter
    region: singapore
    databaseName: kisaan_ml
    user: kisaan

  - name: kisaan-ml-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru