<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kisaan-ML crop advisory app">
  <title>Kisaan-ML</title>
</head>
<body>
    <script>
    (async function () {
      // Upgrade old Flutter offline caches without clearing saved profiles.
      const version = '2026-10-09-v3';
      if (localStorage.getItem('kisaan-web-cache-version') !== version) {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(registration => registration.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.filter(key => key.startsWith('flutter-')).map(key => caches.delete(key)));
        }
        localStorage.setItem('kisaan-web-cache-version', version);
      }
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js';
      script.async = true;
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
