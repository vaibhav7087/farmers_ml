name: kisaan_ml
description: Kisaan-ML - AI-powered crop advisory for Indian farmers
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  permission_handler: ^11.3.0
  fl_chart: ^0.68.0
